<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vitiamo — Italian wine regions</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      /* Use transparent if your Wix block background is already #313030 */
      background: #313030;
      color: #e8e4df;
    }
    .square-root {
      position: relative;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      background: #313030;
    }
    .square-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #map {
      display: block;
      width: 100%;
      height: 100%;
      background: #313030;
    }
    .region {
      stroke: #a28e65;
      stroke-width: 0.65;
      cursor: pointer;
      transition: fill 0.14s ease, opacity 0.14s ease, stroke 0.14s ease;
    }
    .region--stock {
      fill: #4b4437;
    }
    .region--stock:hover,
    .region--stock.is-selected {
      fill: #5e5649;
    }
    .region--other {
      fill: #313030;
    }
    .region--other:hover,
    .region--other.is-selected {
      fill: #3a3836;
    }
    .region.is-dimmed {
      opacity: 0.42;
    }
    .status {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: #a8a090;
      pointer-events: none;
    }
    #tip {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      padding: 8px 12px;
      max-width: 260px;
      background: rgba(22, 21, 21, 0.95);
      color: #f2efe8;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.35;
      border-radius: 6px;
      border: 1px solid #a28e65;
      opacity: 0;
      transition: opacity 0.06s;
    }
    #tip .tip-name {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 2px;
    }
    #tip .tip-sub {
      display: block;
      opacity: 0.88;
      font-size: 11px;
    }
    .detail-card {
      position: absolute;
      left: 8px;
      bottom: 8px;
      right: auto;
      top: auto;
      width: min(calc(100% - 16px), 300px);
      max-height: min(48%, 320px);
      overflow-y: auto;
      z-index: 5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: rgba(49, 48, 48, 0.94);
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid #a28e65;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    .detail-card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      color: #f2efe8;
      line-height: 1.25;
    }
    .detail-card .detail-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #3a3836;
      display: none;
    }
    .detail-card .detail-img.is-visible {
      display: block;
    }
    .detail-card p.desc {
      margin: 0 0 10px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #c9c4bc;
    }
    .detail-card .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .detail-card a.btn-shop {
      display: inline-block;
      padding: 8px 12px;
      background: #a28e65;
      color: #1a1918 !important;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 5px;
      transition: background 0.15s, color 0.15s;
    }
    .detail-card a.btn-shop:hover {
      background: #b8a67a;
      color: #0f0f0f !important;
    }
    .detail-card .placeholder {
      font-size: 0.8rem;
      color: #9a958c;
      line-height: 1.45;
    }
    #credit {
      position: absolute;
      top: 6px;
      right: 8px;
      left: auto;
      bottom: auto;
      max-width: min(52%, 220px);
      margin: 0;
      font-size: 9px;
      font-family: system-ui, sans-serif;
      color: #6e6a64;
      line-height: 1.35;
      text-align: right;
      z-index: 4;
      pointer-events: auto;
    }
    #credit a {
      color: #a28e65;
    }
  </style>
</head>
<body>
  <div class="square-root">
    <div class="status" id="status">Loading map…</div>
    <div class="square-frame" id="square-frame">
      <svg id="map" role="img" aria-label="Interactive map of Italian regions"></svg>
      <aside class="detail-card" id="detail" aria-live="polite">
        <h2 id="detail-title">Select a region</h2>
        <img id="detail-img" class="detail-img" alt="" width="400" height="300" />
        <p class="desc placeholder" id="detail-desc">
          Hover the map for a preview. Click a region to keep it selected.
        </p>
        <div class="detail-actions" id="detail-actions"></div>
      </aside>
    </div>
    <p id="credit">
      Boundaries: ISTAT via
      <a href="https://github.com/openpolis/geojson-italy" target="_blank" rel="noopener">openpolis/geojson-italy</a>
      (CC-BY).
    </p>
  </div>

  <div id="tip" aria-hidden="true">
    <span class="tip-name" id="tip-name"></span>
    <span class="tip-sub" id="tip-sub"></span>
  </div>

  <script src="https://unpkg.com/d3@7"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <script>
    (function () {
      var SHOP_BASE = "https://www.vitiamo.co.uk/category/all-wines";

      var REGION_CONFIG = {
        Puglia: {
          shopRegion: "Apulia",
          title: "Apulia (Puglia)",
          description:
            "The heel of Italy: generous reds, crisp whites, and characterful rosés. Explore our curated Apulian selection.",
          image: "",
        },
        Campania: {
          shopRegion: "Campania",
          title: "Campania",
          description:
            "From volcanic slopes to coastal hills—wines with nerve and fragrance. Discover Campania in our shop.",
          image: "",
        },
        "Friuli-Venezia Giulia": {
          shopRegion: "Friuli Venezia Giulia",
          title: "Friuli Venezia Giulia",
          description:
            "Alpine freshness and Adriatic influence: precise whites and elegant reds. Browse Friuli wines.",
          image: "",
        },
        Lombardia: {
          shopRegion: "Lombardia",
          title: "Lombardy",
          description:
            "From Alpine Nebbiolo to sparkling Franciacorta—Lombardy’s diversity in the bottle.",
          image: "",
        },
        Marche: {
          shopRegion: "Marche",
          title: "Marche",
          description:
            "Verdicchio and coastal reds from Italy’s Adriatic heartland.",
          image: "",
        },
        Piemonte: {
          shopRegion: "Piemonte",
          title: "Piedmont",
          description:
            "Barolo, Barbaresco, Barbera, and beyond—the benchmark region for Nebbiolo lovers.",
          image: "",
        },
        Sicilia: {
          shopRegion: "Sicilia",
          title: "Sicily",
          description:
            "Sun-drenched island wines: Etna finesse to generous Nero d’Avola.",
          image: "",
        },
        "Trentino-Alto Adige": {
          shopRegion: "Trentino Alto Adige",
          title: "Trentino-Alto Adige",
          description:
            "Alpine whites and structured reds from Italy’s northern frontier.",
          image: "",
        },
        Toscana: {
          shopRegion: "Toscana",
          title: "Tuscany",
          description:
            "Chianti, Brunello, Super Tuscans, and coastal gems—Tuscany needs little introduction.",
          image: "",
        },
        Umbria: {
          shopRegion: "Umbria",
          title: "Umbria",
          description:
            "The green heart of Italy—Sagrantino, Grechetto, and soulful countryside wines.",
          image: "",
        },
        Veneto: {
          shopRegion: "Veneto",
          title: "Veneto",
          description:
            "Prosecco, Amarone, Soave, and Valpolicella: Veneto’s greatest hits.",
          image: "",
        },
      };

      var TOPO_URL =
        "https://raw.githubusercontent.com/openpolis/geojson-italy/master/topojson/limits_IT_regions.topo.json";

      var squareFrame = document.getElementById("square-frame");
      var statusEl = document.getElementById("status");
      var tipEl = document.getElementById("tip");
      var tipName = document.getElementById("tip-name");
      var tipSub = document.getElementById("tip-sub");
      var detailTitle = document.getElementById("detail-title");
      var detailDesc = document.getElementById("detail-desc");
      var detailImg = document.getElementById("detail-img");
      var detailActions = document.getElementById("detail-actions");
      var svg = d3.select("#map");
      var selectedFeature = null;
      var regionsGeo = null;
      var projection = d3.geoMercator();
      var geoPath = d3.geoPath(projection);
      var layoutScheduled = false;

      document.getElementById("detail").addEventListener("click", function (e) {
        e.stopPropagation();
      });

      function regionGeoName(d) {
        return (d.properties && d.properties.reg_name) || "";
      }

      function getConfig(d) {
        var name = regionGeoName(d);
        return REGION_CONFIG[name] || null;
      }

      function shopUrl(shopRegion) {
        return SHOP_BASE + "?Region=" + encodeURIComponent(shopRegion);
      }

      function showTip(name, sub, x, y) {
        tipName.textContent = name;
        tipSub.textContent = sub || "";
        tipEl.style.left = Math.min(window.innerWidth - 270, x + 14) + "px";
        tipEl.style.top = Math.min(window.innerHeight - 72, y + 14) + "px";
        tipEl.style.opacity = "1";
      }

      function hideTip() {
        tipEl.style.opacity = "0";
      }

      function renderDetail(d) {
        detailActions.innerHTML = "";
        if (!d) {
          detailTitle.textContent = "Select a region";
          detailDesc.textContent =
            "Hover the map for a preview. Click a region to keep it selected.";
          detailDesc.className = "desc placeholder";
          detailImg.classList.remove("is-visible");
          detailImg.removeAttribute("src");
          detailImg.alt = "";
          return;
        }

        var cfg = getConfig(d);
        var geo = regionGeoName(d);

        if (cfg) {
          detailTitle.textContent = cfg.title;
          detailDesc.textContent = cfg.description;
          detailDesc.className = "desc";
          if (cfg.image) {
            detailImg.src = cfg.image;
            detailImg.alt = cfg.title;
            detailImg.classList.add("is-visible");
          } else {
            detailImg.classList.remove("is-visible");
            detailImg.removeAttribute("src");
            detailImg.alt = "";
          }
          var a = document.createElement("a");
          a.className = "btn-shop";
          a.href = shopUrl(cfg.shopRegion);
          a.target = "_top";
          a.rel = "noopener";
          a.textContent = "Shop " + cfg.shopRegion + " wines";
          detailActions.appendChild(a);
        } else {
          detailTitle.textContent = geo || "Region";
          detailDesc.textContent =
            "We do not currently list wines from this region online. Check back as our range grows—or contact us for special requests.";
          detailDesc.className = "desc placeholder";
          detailImg.classList.remove("is-visible");
          detailImg.removeAttribute("src");
          detailImg.alt = "";
        }
      }

      function syncSelectionClasses() {
        svg.selectAll("path.region").each(function (feat) {
          var sel = selectedFeature === feat;
          d3.select(this)
            .classed("is-selected", sel)
            .classed("is-dimmed", selectedFeature && !sel);
        });
      }

      function squareSize() {
        var w = squareFrame.clientWidth;
        var h = squareFrame.clientHeight;
        var s = Math.floor(Math.min(w, h) || w || 320);
        return Math.max(120, s);
      }

      function layoutMap() {
        if (!regionsGeo) return;
        var S = squareSize();
        projection.fitSize([S, S], regionsGeo);
        svg.attr("viewBox", "0 0 " + S + " " + S).attr("width", S).attr("height", S);
        svg.selectAll("path.region").attr("d", geoPath);
      }

      function scheduleLayout() {
        if (layoutScheduled) return;
        layoutScheduled = true;
        requestAnimationFrame(function () {
          layoutScheduled = false;
          layoutMap();
        });
      }

      fetch(TOPO_URL)
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (topology) {
          regionsGeo = topojson.feature(topology, topology.objects.regions);

          svg
            .selectAll("path.region")
            .data(regionsGeo.features)
            .join("path")
            .attr("class", function (d) {
              return "region " + (getConfig(d) ? "region--stock" : "region--other");
            })
            .attr("data-reg", regionGeoName)
            .on("mouseenter", function (event, d) {
              var cfg = getConfig(d);
              var name = cfg ? cfg.title : regionGeoName(d);
              var sub = cfg
                ? "Vitiamo listing available — see panel."
                : "No shop listing for this region.";
              showTip(name, sub, event.clientX, event.clientY);
              renderDetail(d);
            })
            .on("mousemove", function (event, d) {
              var cfg = getConfig(d);
              var name = cfg ? cfg.title : regionGeoName(d);
              var sub = cfg
                ? "Vitiamo listing available — see panel."
                : "No shop listing for this region.";
              showTip(name, sub, event.clientX, event.clientY);
            })
            .on("mouseleave", function () {
              hideTip();
              renderDetail(selectedFeature);
            })
            .on("click", function (event, d) {
              event.stopPropagation();
              if (selectedFeature === d) {
                selectedFeature = null;
              } else {
                selectedFeature = d;
              }
              syncSelectionClasses();
              renderDetail(selectedFeature);
            });

          document.addEventListener("click", function () {
            selectedFeature = null;
            syncSelectionClasses();
            renderDetail(null);
          });

          layoutMap();

          if (typeof ResizeObserver !== "undefined") {
            new ResizeObserver(scheduleLayout).observe(squareFrame);
          }
          window.addEventListener("resize", scheduleLayout);

          statusEl.style.display = "none";
        })
        .catch(function (err) {
          statusEl.textContent =
            "Could not load map. (" + (err && err.message ? err.message : "error") + ")";
          console.error(err);
        });
    })();
  </script>
</body>
</html>
